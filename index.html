    <style>
        body {

        }

  <body>

    <h1>> KERNEL_BREACH_V1.0</h1>
    <p>Il sistema è pronto per l'iniezione del codice.</p>
    
    <button onclick="game.start()">AVVIA EXPLOIT</button>
    
    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    -->

    <script>

      /**
 * THE KERNEL BREACH
 * Un gioco testuale per dev stanchi.
 */

const game = {
  player: {
    name: "",
    bitcoins: 10,
    cpuPower: 100,
    inventory: []
  },

  // Database delle stanze/stati
  nodes: {
    gate: {
      description: "Sei al 'Security Gate'. Il firewall sembra avere un leak di memoria.",
      options: [
        { text: "Tenta un Buffer Overflow", next: "overflow" },
        { text: "Usa una SQL Injection", next: "database" }
      ]
    },
    overflow: {
      description: "Il sistema crasha! Hai ottenuto i permessi di Root, ma la CPU scotta.",
      effect: () => { game.player.cpuPower -= 30; game.player.inventory.push("Root Access"); },
      options: [{ text: "Procedi verso il Core", next: "core" }]
    },
    database: {
      description: "La query restituisce: 'DROP TABLE students;'. Ops. Hai trovato dei Bitcoin però.",
      effect: () => { game.player.bitcoins += 50; },
      options: [{ text: "Torna al Gate", next: "gate" }, { text: "Vai al Core", next: "core" }]
    },
    core: {
      description: "Sei nel Core. Il Garbage Collector sta arrivando per eliminarti!",
      options: [
        { text: "Lancia un ciclo infinito per bloccarlo", next: "ending_win" },
        { text: "Prova a fare il log di 'this'", next: "ending_loss" }
      ]
    },
    ending_win: {
      description: "Il sistema è bloccato al 100% CPU. Sei una leggenda. WIN.",
      final: true
    },
    ending_loss: {
      description: "Hai provato a capire 'this' in una arrow function. Il tuo cervello è andato in segment fault. GAME OVER.",
      final: true
    }
  },

  async start() {
    this.player.name = prompt("Inserisci il tuo alias da hacker:") || "User404";
    alert(`Benvenuto nel sistema, ${this.player.name}. La tua missione è crashare il Core.`);
    this.loop("gate");
  },

  loop(nodeKey) {
    const node = this.nodes[nodeKey];
    
    // Esegui effetti collaterali se presenti
    if (node.effect) node.effect();

    if (this.player.cpuPower <= 0) {
      alert("CPU Bruciata. Sei offline per sempre.");
      return;
    }

    let message = `${node.description}\n\n` +
                  `STATUS: CPU ${this.player.cpuPower}% | BTC: ${this.player.bitcoins}\n` +
                  `ZAINO: [${this.player.inventory.join(", ")}]\n\n` +
                  "Scegli un'azione:";

    node.options.forEach((opt, i) => {
      message += `\n${i + 1}. ${opt.text}`;
    });

    if (node.final) {
      alert(node.description);
      return;
    }

    const choice = prompt(message);
    const index = parseInt(choice) - 1;

    if (node.options[index]) {
      this.loop(node.options[index].next);
    } else {
      alert("Comando non riconosciuto. Il sistema ti sta tracciando...");
      this.loop(nodeKey);
    }
  }
};

// Avvia il gioco
game.start();
      
    </script>
    
  </body>
